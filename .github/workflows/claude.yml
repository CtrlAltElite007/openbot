name: Claude

# Runs Claude Code when a comment, review or new issue mentions `@claude`. Part of the agent team
# set up in PROTOCOL.md on the `team/coordination` branch (task T-02).
#
# Comment and issue events run the copy of this file on the repository's default branch, so it only
# starts once it is on that branch.
#
# Needs one of these repository secrets: `ANTHROPIC_API_KEY`, or `CLAUDE_CODE_OAUTH_TOKEN` from
# `claude setup-token`. Also needs the Claude GitHub App (https://github.com/apps/claude) installed
# on this repository. The action only answers users with write access.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # One run at a time per issue or pull request, so two mentions do not push to the same branch at once.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets Claude read CI results on pull requests.
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `main` mirrors upstream. Work for this fork starts from `custom/main`.
          base_branch: custom/main
          branch_prefix: "feature/claude-"
          claude_args: |
            --append-system-prompt "You are agent claude-action on the CtrlAltElite007/openbot team. Team rules are in PROTOCOL.md on the team/coordination branch. Read them with: git fetch origin team/coordination && git show origin/team/coordination:PROTOCOL.md. Start new work from custom/main and open pull requests into custom/main, never into main. Never push to custom/main or main directly, and never merge a pull request. Keep each change to the one issue or request you were asked about. Sign your comments and commits with claude-action."
